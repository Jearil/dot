# Middle-click pastes the macOS clipboard, passing the click through to apps
# that use the mouse or when in copy-mode.
bind-key -T root MouseDown2Pane select-pane -t = \; \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { run-shell "pbpaste | tmux load-buffer -b _primary - && tmux paste-buffer -p -b _primary -d" }

# Route tmux's selections to the macOS clipboard.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "pbcopy"
