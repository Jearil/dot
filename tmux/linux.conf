# Middle-click pastes the Wayland primary selection (last-highlighted text),
# matching native Linux behaviour. tmux's default MouseDown2Pane pastes its
# own internal paste-buffer instead, which is why middle-click felt broken.
# Still pass the click through to apps that use the mouse (vim, htop) or when
# in copy-mode.
bind-key -T root MouseDown2Pane select-pane -t = \; \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { run-shell "wl-paste --primary --no-newline | tmux load-buffer -b _primary - && tmux paste-buffer -p -b _primary -d" }

# Route tmux's own selections into the Wayland primary selection so
# highlighting text in tmux behaves like any native Linux app (and can be
# middle-click pasted back). copy-pipe-and-cancel still also sets the OSC52
# system clipboard from `set-clipboard external`, so SSH clipboard keeps working.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy --primary"
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "wl-copy --primary"
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "wl-copy --primary"
bind-key -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy --primary"
bind-key -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy --primary"

# Double/triple-click while NOT already in copy-mode is handled by the root
# table; mirror it to primary while keeping the mouse-app passthrough guard.
bind-key -T root DoubleClick1Pane select-pane -t = \; \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "wl-copy --primary" }
bind-key -T root TripleClick1Pane select-pane -t = \; \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "wl-copy --primary" }
